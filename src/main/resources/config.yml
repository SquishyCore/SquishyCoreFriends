# -------------------------------
# SquishyCoreFriends
# v1.0
# -------------------------------

# The prefix displayed in front of the plugin messages & titles
prefix: '&d&lSquishy&b&lCore&r &e»&r '

# MySQL database credentials (MySQL is currently the only storage driver supported by this plugin, and thus you have to fill in the credentials below)
database:
  hostname: ''
  username: ''
  password: ''
  name: ''
  port: '3306'
  tables_prefix: 'sc_friends_'

permissions:
  reload: 'squishycorefriends.reload' # Given to those who can reload the plugin
  use: 'squishycorefriends.use' # Given to those who can use the plugin commands
  help: 'squishycorefriends.help' # Given to those who can use the plugin help command
  list: 'squishycorefriends.list' # Given to those who can list their friends
  home: 'squishycorefriends.home' # Given to those who can teleport to a friendship home
  sethome: 'squishycorefriends.home.set' # Given to those who can set a friendship home location
  tp: 'squishycorefriends.tp' # Given to those who can teleport to a friend
  add: 'squishycorefriends.add' # Given to those who can add friends
  remove: 'squishycorefriends.remove' # Given to those who can remove friends
  hug: 'squishycorefriends.hug' # Given to those who can hug a friend
  toggle: 'squishycorefriends.toggle' # Given to those who can toggle their friend requests on/off
  toggleHugs: 'squishycorefriends.toggle.hugs' # Given to those who can toggle their ability to be hugged on/off
  toggleTps: 'squishycorefriends.toggle.tps' # Given to those who can toggle their friend teleports on/off
  requestAccept: 'squishycorefriends.requests.accept' # Given to those who can accept a friend request
  requestDeny: 'squishycorefriends.requests.deny' # Given to those who can deny a friend request
  requestIgnore: 'squishycorefriends.requests.ignore' # Given to those who can ignore a friend request
  tpRequestAccept: 'squishycorefriends.tprequests.accept' # Given to those who can accept a teleport request
  tpRequestDeny: 'squishycorefriends.tprequests.deny' # Given to those who can deny a teleport request
  tpRequestIgnore: 'squishycorefriends.tprequests.ignore' # Given to those who can ignore a teleport request

  # Define the permission node prefix which will be used for limiting the players' friends count
  # For example, if a player has the permission node `squishycorefriends.limits.2` then their total friends limit will be 2 friends.
  # In addition to that, if a player has the permission node `squishycorefriends.limits.+3` then 3 more friends will be added to their limit (2 + 3 = 5)
  # And if a player has the permission node `squishycorefriends.limits.-1` then 1 friend will be removed from the limit (2 + 3 - 1 = 4)
  limits_prefix: 'squishycorefriends.limits.'

# Allow players to send friend requests to other offline players. Offline players will then be notified about their pending friend requests once they join the server
allowOfflineFriendRequests: false # Offline requests is a still "to be implemented" feature. Keep this `false` till the feature is implemented

# Define the number of seconds you want inactive/ignored friend requests to expire after
requestsExpiry: 300

friendTeleports:
  instantlyTeleport: true # Set this to `false` if you want friend teleports to work through requests
  allowOfflineTeleports: true # Allow teleports to friends which are offline. This is ineffective if `instantlyTeleport` is false
  requestsExpiry: 300 # Define the number of seconds you want inactive/ignored teleport requests to expire after

alerts:
  onceFriendJoins: true # Send a message to the friends of a player once they join
  onceFriendLeaves: true # Send a message to the friends of a player once they leave

effects:
  hugSound: ENTITY_PLAYER_LEVELUP # Check https://helpch.at/docs/1.19.3/org/bukkit/Sound.html for a list
  hugSoundVolume: 10
  hugSoundPitch: 29

  teleportSound: BLOCK_BELL_USE # Check https://helpch.at/docs/1.19.3/org/bukkit/Sound.html for a list
  teleportSoundVolume: 10
  teleportSoundPitch: 29

  friendJoinSound: ENTITY_PLAYER_LEVELUP # Check https://helpch.at/docs/1.19.3/org/bukkit/Sound.html for a list
  friendJoinSoundVolume: 10
  friendJoinSoundPitch: 29

SuperVanish:
  respect: true

